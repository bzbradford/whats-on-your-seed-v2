[project]
name = "seed-pipeline"
version = "0.1.0"
description = "Downloads the EPA APPRIL workbook and publishes the seed treatment catalog JSON for the web app."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Only needed to regenerate the printable fact sheet PDF.
factsheet = ["reportlab>=4.0,<5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
