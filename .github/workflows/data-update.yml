name: Data update

# Weekly: ask EPA whether the APPRIL workbook changed (HEAD request). If it did,
# download and reconcile it; if the catalog changed, validate everything, commit
# public/data/ to main, and redeploy Pages. Unchanged weeks write and commit
# nothing. Failures fail the job (GitHub emails the workflow's owner) and leave
# the published catalog untouched. Git history of public/data/ is the change log.

on:
  schedule:
    # Off the top of the hour: GitHub delays or drops scheduled runs at :00 under load.
    - cron: '30 6 * * 1' # Mondays
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      force:
        description: Download and reconcile even if EPA reports the workbook unchanged
        type: boolean
        default: false

permissions:
  contents: write # commit public/data/
  actions: write # dispatch the Pages deploy

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Check EPA and update the catalog if it changed
        working-directory: pipeline
        env:
          FORCE: ${{ inputs.force }}
          GREENBOOK_FEED_URL: ${{ secrets.GREENBOOK_FEED_URL }}
          GREENBOOK_FEED_TOKEN: ${{ secrets.GREENBOOK_FEED_TOKEN }}
          CDMS_FEED_URL: ${{ secrets.CDMS_FEED_URL }}
          CDMS_FEED_TOKEN: ${{ secrets.CDMS_FEED_TOKEN }}
        run: uv run python scheduled_update.py $([ "$FORCE" = true ] && echo --force)

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git status --short public/data
          else
            echo 'No changes to publish.'
          fi

      # Validate the new data against the pipeline tests and the full web app
      # (unit, build, e2e) before anything is published.
      - name: Validate the updated catalog
        if: steps.diff.outputs.changed == 'true'
        working-directory: pipeline
        run: uv run pytest -q

      - uses: pnpm/action-setup@v6
        if: steps.diff.outputs.changed == 'true'

      - uses: actions/setup-node@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Check the web app with the updated catalog
        if: steps.diff.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm verify
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          if git diff --quiet public/data/catalog.json; then
            SUMMARY='workbook re-uploaded with identical content; record its headers'
          else
            SUMMARY=$(jq -r '"\(.message) (\(.changes.added) added, \(.changes.changed) changed, \(.changes.removed) removed)"' public/data/sync-status.json)
          fi
          git add public/data/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update catalog from EPA: $SUMMARY"
          # A concurrent edit makes this ordinary push fail, rather than overwriting it.
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, but
      # workflow_dispatch does, so redeploy explicitly.
      - name: Redeploy Pages
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yaml --ref main
